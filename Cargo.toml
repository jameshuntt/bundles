[package]
name = "bundles"
version = "0.2.3"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Bundle a source tree into one annotated file and unbundle it back, safely: marker lines per file, ignore dirs, text-only, no path escapes."
authors = ["James Hunt <james@1o.business>"]
repository = "https://github.com/jameshuntt/bundles"
keywords = ["bundle", "source", "archive", "unbundle"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[features]
default = ["bin"]
# the `bundles` program (bundle, unbundle, install); a library user turns it off with default-features = false
bin = ["dep:clap", "dep:installation"]

[[bin]]
name = "bundles"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
syn = { version = "2", features = ["full", "parsing"] }
walkdir = "2.5"
sha2 = "0.10"
regex = "1.11"
pathgen = "0.1.0"
installation = { version = "0.2.0", optional = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
